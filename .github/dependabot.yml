# Monthly, grouped dependency updates -- one pull request, not a stream of them.
# Versions pinned on purpose are left alone (see the comments in pyproject.toml /
# requirements.txt for why each one is pinned).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    assignees: ["Amgib00"]               # reviews: .github/CODEOWNERS asks the owner automatically
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "briefcase"      # 0.3.15 on macOS 10.15; 0.4.4 on Python 3.10
      - dependency-name: "pydantic"       # 2.13.4 desktop server; 1.10.26 on phones
      - dependency-name: "numba"          # Intel-Mac build pin
      - dependency-name: "llvmlite"       # pairs with numba
      - dependency-name: "numpy"          # 2.2.x: numba 0.62 / shazamio; 2.3 drops Python 3.10
      - dependency-name: "cryptography"   # 49+ has no Intel-Mac builds
      - dependency-name: "webauthn"       # 2.x on Intel Macs (3.x needs cryptography 49+)
      - dependency-name: "cbor2"          # 5.x on Intel Macs (6.x has no Intel-Mac builds)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    assignees: ["Amgib00"]
