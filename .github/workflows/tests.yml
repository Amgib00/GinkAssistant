# Runs Gink's test suite on every push and pull request.
# requirements-test.txt is the minimal set -- checked in clean Python 3.11 and 3.13 environments.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # build and test only: nothing here writes to the repository

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]        # oldest supported (32-bit Android) and newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Run the tests
        # No test reaches the internet (tests/conftest.py): the same results here as on any computer. -rfE lists
        # every failure with its reason at the end of the log.
        run: python -m pytest tests -q -rfE

  browser:
    # The tests that open Gink's pages in a real browser (Chromium through Playwright): the sidebar,
    # the phone layout, People, the old-WebKit layout fix, video frames. The job above has no browser, so they skip there.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test requirements and Chromium
        run: |
          python -m pip install -r requirements-test.txt "playwright==1.65.2"
          python -m playwright install --with-deps chromium
      - name: Run the browser tests
        run: python -m pytest -q -rfE $(grep -l "sync_playwright" tests/test_*.py)

  dependency-review:
    # A pull request that adds or updates a package with a known high-severity problem fails here
    # (GitHub's advisory database; it compares the dependency graph before and after, no secrets needed).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high

  lint:
    # The warnings PyCharm shows that are real problems: unused imports and variables, names that don't
    # exist, code a supported Python can't parse (3.11 here: the Catalina and 32-bit Android builds).
    # Settings: [tool.ruff] in pyproject.toml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check with Ruff
        run: python -m pip install "ruff==0.17.4" && ruff check src tools tests cli

  specs:
    # The OpenSpec specs (openspec/) must stay valid: requirements with scenarios, correct format.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate specs and changes (OpenSpec, strict)
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive
