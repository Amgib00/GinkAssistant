# Runs Gink's test suite on every push and pull request.
# requirements-test.txt is the minimal set -- checked in clean Python 3.10 and 3.13 environments.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Run the tests
        run: python -m pytest tests -q

  specs:
    # The OpenSpec specs (openspec/) must stay valid: requirements with scenarios, correct format.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate specs and changes (OpenSpec, strict)
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive
