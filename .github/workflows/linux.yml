# Builds Gink for Linux (a .deb for Ubuntu 24.04+ / Debian 13+) on GitHub's Ubuntu machine.
# Run it: Actions -> "Linux app" -> Run workflow. Result: the run's page -> Artifacts.
# Briefcase builds Linux apps with the system's own Python (Ubuntu 24.04: 3.12) and libraries;
# the packages come from pyproject.toml (linux.system.debian).
name: Linux app

on:
  workflow_dispatch:
  workflow_call:          # used by release.yml

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: System packages (build + run)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-venv build-essential \
            libcairo2-dev libgirepository-2.0-dev pkg-config portaudio19-dev cmake \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgirepository-2.0-0 libcanberra-gtk3-module libportaudio2 \
            libgl1 libgtk-3-0t64 libwebkit2gtk-4.1-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0
      - name: Build the .deb with Briefcase (system Python)
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF        # llama-cpp-python: no CPU features older PCs lack
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --upgrade pip briefcase
          briefcase create linux system --no-input
          briefcase build linux system --no-input
          briefcase package linux system --adhoc-sign --no-input
          ls -l dist
          cp "$(ls dist/*.deb | head -1)" Gink-linux-amd64.deb
      - uses: actions/upload-artifact@v7
        with:
          name: Gink-linux-amd64
          path: Gink-linux-amd64.deb
          retention-days: 14
