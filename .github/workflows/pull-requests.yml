# Pull requests, step 1 of 2: notes which pull request this is, for the triage (pull-request-triage.yml).
#
# Why two workflows (0.1.162): the triage needs write access (labels, assignee, milestone, closing pull requests from
# people who aren't collaborators). It used pull_request_target for that, which GitHub restricts on public repositories
# from 2 December 2026. This step runs on pull_request with read-only access and no secrets -- it never checks out or
# runs the pull request's code, it only saves its number -- and the triage runs right after it (workflow_run) from the
# default branch's own workflow file, with write access, treating that number as untrusted input.
name: Pull requests

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  record:
    name: Record it for triage
    runs-on: ubuntu-24.04
    steps:
      - name: Save its number and what happened
        env:
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          mkdir -p pr
          printf '%s\n%s\n' "$PR" "$ACTION" > pr/pull-request.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pull-request
          path: pr/pull-request.txt
          retention-days: 1
