# Gink Genie -- the coding workspace as its own app (src/ginkgenie). A small WebView app: no AI, audio
# or native libraries, so every build is quick. Used by release.yml; can also be run on its own.
name: Gink Genie build

on:
  workflow_dispatch:
  workflow_call:          # used by release.yml

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Apple Silicon, runner: macos-15, arch: arm64, min_os: "12.0" }
          - { name: Intel, runner: macos-15-intel, arch: x86_64, min_os: "11.0" }
    name: Gink Genie Mac (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Gink Genie
        run: |
          python -m pip install briefcase
          OVERRIDES=(-C "universal_build=false" -C "min_os_version=\"$MACOSX_DEPLOYMENT_TARGET\"")
          briefcase create macOS app -a ginkgenie --no-input "${OVERRIDES[@]}"
          briefcase build macOS app -a ginkgenie --no-input "${OVERRIDES[@]}"
          briefcase package macOS app -a ginkgenie --adhoc-sign --no-input "${OVERRIDES[@]}"
          ls -l dist
          cp "$(ls dist/*.dmg | head -1)" "Gink-Genie-mac-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: Gink-Genie-mac-${{ matrix.arch }}
          path: Gink-Genie-mac-${{ matrix.arch }}.dmg
          retention-days: 14

  windows:
    name: Gink Genie Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Gink Genie
        shell: bash
        run: |
          python -m pip install briefcase
          briefcase create windows app -a ginkgenie --no-input
          briefcase build windows app -a ginkgenie --no-input
          briefcase package windows app -a ginkgenie --adhoc-sign --no-input
          ls -l dist
          cp "$(ls dist/*.msi | head -1)" Gink-Genie-windows-x64.msi
      - uses: actions/upload-artifact@v7
        with:
          name: Gink-Genie-windows-x64
          path: Gink-Genie-windows-x64.msi
          retention-days: 14

  linux:
    name: Gink Genie Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: System packages (build + run)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-venv build-essential libcairo2-dev libgirepository-2.0-dev pkg-config \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgirepository-2.0-0 libcanberra-gtk3-module libgtk-3-0t64 libwebkit2gtk-4.1-0
      - name: Build Gink Genie (.deb, system Python)
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --upgrade pip briefcase
          briefcase create linux system -a ginkgenie --no-input
          briefcase build linux system -a ginkgenie --no-input
          briefcase package linux system -a ginkgenie --adhoc-sign --no-input
          ls -l dist
          cp "$(ls dist/*.deb | head -1)" Gink-Genie-linux-amd64.deb
      - uses: actions/upload-artifact@v7
        with:
          name: Gink-Genie-linux-amd64
          path: Gink-Genie-linux-amd64.deb
          retention-days: 14

  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: 64-bit, python: "3.13", apk: Gink-Genie-android.apk, abis: "" }
          - { edition: 32-bit, python: "3.11", apk: Gink-Genie-android-32bit.apk, abis: 'android_abis=["armeabi-v7a"]' }
    name: Gink Genie Android (${{ matrix.edition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build the APK
        env:
          ABIS: ${{ matrix.abis }}
        run: |
          python -m pip install --upgrade pip briefcase
          ARGS=(); [ -n "$ABIS" ] && ARGS=(-C "$ABIS")
          briefcase create android -a ginkgenie --no-input "${ARGS[@]}"
          briefcase build android -a ginkgenie --no-input "${ARGS[@]}"
          APK=$(find build/ginkgenie/android -name "*.apk" | head -1)
          echo "Built: $APK"; cp "$APK" "${{ matrix.apk }}"
          unzip -l "${{ matrix.apk }}" | grep -oE "lib/[^/]+/" | sort -u
      - uses: actions/upload-artifact@v7
        with:
          name: Gink-Genie-Android-${{ matrix.edition }}
          path: ${{ matrix.apk }}
          retention-days: 14
