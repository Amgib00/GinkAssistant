# Builds Gink for iOS on a GitHub-hosted Mac (macOS 26 + Xcode 26).
# Why in the cloud: Briefcase needs Xcode 26 (Apple's App Store minimum since
# April 2026), which needs macOS 15+; it can't run on macOS 10.15 Catalina.
#
# Run it: GitHub -> Actions -> "iOS build" -> Run workflow (or push to main).
# Result: Actions run page -> Artifacts -> "Gink-iOS-Simulator" (the .app for the
# iOS Simulator). Installing on a real iPhone / TestFlight additionally needs an
# Apple Developer Program membership and signing (see deploy/IOS_AND_WEB.md).
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "pyproject.toml", ".github/workflows/ios.yml"]

jobs:
  ios-startup-check:
    # Fast check on Linux first: every module imports with ONLY the iOS packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install toga-core toga-dummy pytest httpx groq "pydantic==1.10.26" pillow fpdf2 openpyxl pypdf markdown pygments python-dotenv requests tzdata aiofiles
      - run: python -m pytest tests/test_ios_startup.py -q

  ios-build:
    needs: ios-startup-check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"       # Pillow publishes iPhone builds for Python 3.13+
      - name: Show Xcode
        run: xcodebuild -version
      - name: Install Briefcase
        run: python -m pip install --upgrade pip briefcase
      - name: Create the iOS project  (build/ginkassistant/ios/xcode)
        run: briefcase create iOS --no-input
      - name: Build for the iOS Simulator
        run: briefcase build iOS --no-input
      - name: Collect the app
        run: |
          APP=$(find build/ginkassistant/ios -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "Built: $APP"
          ditto -c -k --keepParent "$APP" Gink-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Gink-iOS-Simulator
          path: Gink-iOS-Simulator.zip
          retention-days: 14
