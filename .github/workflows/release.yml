# Publishes a GitHub Release with the Mac and Android installers.
# TEST BUILD by default (a GitHub "pre-release"): it's on GitHub for you to try, but the apps' update
# offer and the website's download links keep pointing to the last release made FOR USERS.
#   Release for users straight away:  gh workflow run release.yml -R <owner>/<repo> -f version=vX.Y.Z -f for_users=true
#   Or give a tested build to users:  gh release edit vX.Y.Z -R <owner>/<repo> --prerelease=false --latest --title "Gink vX.Y.Z"
# Run it: GitHub -> Actions -> "Release" -> Run workflow (leave the version empty to release the version in
# pyproject.toml), or: gh workflow run release.yml -R <owner>/<repo> [-f version=vX.Y.Z]
# The files keep fixed names, so these links always point to the NEWEST release (the website uses them):
#   https://github.com/<owner>/<repo>/releases/latest/download/Gink-mac-arm64.dmg
#   https://github.com/<owner>/<repo>/releases/latest/download/Gink-mac-x86_64.dmg
#   https://github.com/<owner>/<repo>/releases/latest/download/Gink-android.apk
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version like v0.1.0 -- leave empty to use the version in pyproject.toml"
        required: false
        default: ""
      for_users:
        description: "Offer it to users now? (no = a test build: on GitHub, but apps and the website keep the last user release)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write        # create the release and its tag

# One release at a time: a second run (e.g. the command run twice) waits for the first, then its
# check stops it in seconds ("already released") -- runs #34 and #35 both built v0.1.14 at once and
# the slower one failed at the very end.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version (format, pyproject.toml, not released yet)
        id: v
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IN_PYPROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ -z "$VERSION" ]; then VERSION="v$IN_PYPROJECT"; echo "No version given: using pyproject.toml's $VERSION"; fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v0.1.0 (got: $VERSION)"; exit 1
          fi
          # the apps compare their own version with the release's, so the release is always the code's version.
          # Asked for an OLDER version (e.g. an earlier command run again)? The newer code includes it: release that.
          if [ "v$IN_PYPROJECT" != "$VERSION" ]; then
            NEWER=$(printf '%s\n%s\n' "${VERSION#v}" "$IN_PYPROJECT" | sort -V | tail -1)
            if [ "$NEWER" = "$IN_PYPROJECT" ]; then
              echo "::warning::You asked for $VERSION, but the code on GitHub is already v$IN_PYPROJECT (it includes $VERSION's changes): releasing v$IN_PYPROJECT."
              VERSION="v$IN_PYPROJECT"
            else
              echo "::error::The code on GitHub is version $IN_PYPROJECT, but you asked to release $VERSION. Usually the new code wasn't published yet: run 'bash tools/publish_to_github.sh' and check it says 'GitHub now has version ${VERSION#v}', then run Release again (the version can be left out)."
              exit 1
            fi
          fi
          # already released (the command run twice, or an older version asked for): nothing to do -- not a failure
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$VERSION is already released: nothing to build. (A new version needs pyproject.toml and CHANGELOG.md bumped first.)"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -q "^## ${VERSION#v} " CHANGELOG.md || echo "::warning::CHANGELOG.md has no '## ${VERSION#v}' section yet."
          echo "OK: releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  mac:
    needs: check
    if: needs.check.outputs.version != ''          # empty = already released: skip quietly
    uses: ./.github/workflows/macos.yml
  android:
    needs: check
    if: needs.check.outputs.version != ''          # empty = already released: skip quietly
    uses: ./.github/workflows/android.yml
  windows:
    needs: check
    if: needs.check.outputs.version != ''          # empty = already released: skip quietly
    uses: ./.github/workflows/windows.yml
  linux:
    needs: check
    if: needs.check.outputs.version != ''          # empty = already released: skip quietly
    uses: ./.github/workflows/linux.yml
  genie:                                    # Gink Genie, the coding workspace app
    needs: check
    if: needs.check.outputs.version != ''          # empty = already released: skip quietly
    uses: ./.github/workflows/genie.yml
  publish:
    needs: [check, mac, android, windows, linux, genie]      # check: for its version output
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Name the files
        run: |
          ls -l dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          FOR_USERS: ${{ inputs.for_users }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download Gink

          | | File | Needs |
          |---|---|---|
          | **Mac (Apple Silicon: M1 to M4)** | `Gink-mac-arm64.dmg` | macOS 12 or later |
          | **Mac (Intel)** | `Gink-mac-x86_64.dmg` | macOS 11 or later |
          | **Android** | `Gink-android.apk` | Android 7 or later, 64-bit (most phones) |
          | **Android (32-bit)** | `Gink-android-32bit.apk` | 32-bit phones such as TECNO POP and itel |
          | **Windows** | `Gink-windows-x64.msi` | Windows 10 or 11 (64-bit) |
          | **Linux** | `Gink-linux-amd64.deb` | Ubuntu 24.04+ or Debian 13+ (64-bit) |

          **Mac:** open the .dmg and drag Gink to Applications. The first time, **right-click Gink and choose Open**
          (the app isn't notarized by Apple yet).
          **Android:** open the .apk on your phone and allow installing apps from this source when asked.
          If it says the app isn't compatible with your phone, use the 32-bit version.
          **Windows:** if SmartScreen warns you, choose **More info**, then **Run anyway** (the installer isn't signed yet).
          **Linux:** `sudo apt install ./Gink-linux-amd64.deb` (installs what Gink needs automatically).

          ## Download Gink Genie (the coding workspace)

          | | File |
          |---|---|
          | **Mac (Apple Silicon)** | `Gink-Genie-mac-arm64.dmg` |
          | **Mac (Intel)** | `Gink-Genie-mac-x86_64.dmg` |
          | **Android** | `Gink-Genie-android.apk` (32-bit phones: `Gink-Genie-android-32bit.apk`) |
          | **Windows** | `Gink-Genie-windows-x64.msi` |
          | **Linux** | `Gink-Genie-linux-amd64.deb` |

          Gink Genie signs in with your Gink account. The same install tips apply.
          This is a test build.
          NOTES
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$VERSION was released by another run while this one was building. Nothing is wrong with Gink: the release already exists."
            exit 1
          fi
          if [ "$FOR_USERS" = "true" ]; then
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Gink $VERSION" --notes-file notes.md --latest
            echo "Released $VERSION FOR USERS: the apps offer it within a day; the website links to it."
          else
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Gink $VERSION (test build)" --notes-file notes.md --prerelease --latest=false
            echo "Released $VERSION as a TEST BUILD: users aren't offered it. To give it to users after testing:"
            echo "  gh release edit $VERSION -R $GITHUB_REPOSITORY --prerelease=false --latest --title \"Gink $VERSION\""
          fi
