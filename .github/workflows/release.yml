# Publishes a GitHub Release with the Mac and Android installers.
# Run it: GitHub -> Actions -> "Release" -> Run workflow (leave the version empty to release the version in
# pyproject.toml), or: gh workflow run release.yml -R <owner>/<repo> [-f version=vX.Y.Z]
# The files keep fixed names, so these links always point to the NEWEST release (the website uses them):
#   https://github.com/<owner>/<repo>/releases/latest/download/Gink-mac-arm64.dmg
#   https://github.com/<owner>/<repo>/releases/latest/download/Gink-mac-x86_64.dmg
#   https://github.com/<owner>/<repo>/releases/latest/download/Gink-android.apk
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version like v0.1.0 -- leave empty to use the version in pyproject.toml"
        required: false
        default: ""

permissions:
  contents: write        # create the release and its tag

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version (format, pyproject.toml, not released yet)
        id: v
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IN_PYPROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ -z "$VERSION" ]; then VERSION="v$IN_PYPROJECT"; echo "No version given: using pyproject.toml's $VERSION"; fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v0.1.0 (got: $VERSION)"; exit 1
          fi
          # the apps compare their own version with the release's: they must match
          if [ "v$IN_PYPROJECT" != "$VERSION" ]; then
            echo "::error::The code on GitHub is version $IN_PYPROJECT, but you asked to release $VERSION. Usually the new code wasn't published yet: run 'bash tools/publish_to_github.sh' and check it says 'GitHub now has version ${VERSION#v}', then run Release again (the version can be left out)."
            exit 1
          fi
          # stop now, not after 30 minutes of building
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$VERSION is already released. Use a new version number (bump pyproject.toml and CHANGELOG.md first)."
            exit 1
          fi
          grep -q "^## ${VERSION#v} " CHANGELOG.md || echo "::warning::CHANGELOG.md has no '## ${VERSION#v}' section yet."
          echo "OK: releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  mac:
    needs: check
    uses: ./.github/workflows/macos.yml
  android:
    needs: check
    uses: ./.github/workflows/android.yml
  windows:
    needs: check
    uses: ./.github/workflows/windows.yml
  linux:
    needs: check
    uses: ./.github/workflows/linux.yml
  publish:
    needs: [check, mac, android, windows, linux]      # check: for its version output
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Name the files
        run: |
          ls -l dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download Gink

          | | File | Needs |
          |---|---|---|
          | **Mac (Apple Silicon: M1 to M4)** | `Gink-mac-arm64.dmg` | macOS 12 or later |
          | **Mac (Intel)** | `Gink-mac-x86_64.dmg` | macOS 11 or later |
          | **Android** | `Gink-android.apk` | Android 7 or later, 64-bit (most phones) |
          | **Android (32-bit)** | `Gink-android-32bit.apk` | 32-bit phones such as TECNO POP and itel |
          | **Windows** | `Gink-windows-x64.msi` | Windows 10 or 11 (64-bit) |
          | **Linux** | `Gink-linux-amd64.deb` | Ubuntu 24.04+ or Debian 13+ (64-bit) |

          **Mac:** open the .dmg and drag Gink to Applications. The first time, **right-click Gink and choose Open**
          (the app isn't notarized by Apple yet).
          **Android:** open the .apk on your phone and allow installing apps from this source when asked.
          If it says the app isn't compatible with your phone, use the 32-bit version.
          **Windows:** if SmartScreen warns you, choose **More info**, then **Run anyway** (the installer isn't signed yet).
          **Linux:** `sudo apt install ./Gink-linux-amd64.deb` (installs what Gink needs automatically).
          This is a test build.
          NOTES
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Gink $VERSION" --notes-file notes.md
