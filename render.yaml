# Render.com blueprint for the Gink server (sign-in, AI, sync, payments, images,
# voices, and Gink on the web at /app).
# Render -> New -> Blueprint -> pick this repository, then fill in the values it asks for.
#
# STARTER PLAN + DISK (for real users): accounts, chats sync and payments live in one SQLite
# file on a 1 GB disk at /var/data, which survives restarts and every new publish. The server
# never sleeps. Render takes a snapshot of the disk every day; tools/backup_db.py downloads
# your own copy too. A server with a disk restarts briefly on each publish (a few seconds offline).
# Check it worked: https://gink-server.onrender.com/health shows "storage": "disk".
# (The free plan has no disk: everything was erased on every restart or publish.)
services:
  - type: web
    name: gink-server
    runtime: docker
    plan: starter
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: gink-data
      mountPath: /var/data
      sizeGB: 1                   # can be made bigger later in Render, never smaller
    envVars:
      # --- secrets: Render asks you for these (never put them in this file) ---
      - key: GROQ_API_KEY          # the AI (console.groq.com) -- only ever stored here, never in the app
        sync: false
      - key: GEMINI_API_KEY        # images + natural voices (aistudio.google.com/apikey)
        sync: false
      - key: ANTHROPIC_API_KEY     # optional: Claude models for Gink Pro (platform.claude.com) -- empty = Groq only
        sync: false
      # Email on Render's FREE plan: Brevo (SMTP ports are blocked there). Free Brevo account ->
      # Settings > SMTP & API > API keys; verify your sender address under Senders.
      - key: BREVO_API_KEY
        sync: false
      # Phone sign-in (SMS). Fill in ONE provider. Each SMS costs money: GINK_SMS_MONTHLY_LIMIT caps them.
      - key: AT_USERNAME           # Africa's Talking app username ("sandbox" for free testing)
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID          # optional: your approved sender name
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM           # your Twilio phone number, like +15550001111
        sync: false
      - key: GINK_SMS_MONTHLY_LIMIT
        value: "500"
      - key: EMAIL_FROM          # the sender you verified in Brevo (e.g. your Gmail address)
        sync: false
      - key: GMAIL_USER            # sends sign-up / login codes (a Gmail address)
        sync: false
      - key: GMAIL_APP_PASSWORD    # a Gmail "app password", not your normal password
        sync: false
      - key: GINK_PUBLIC_URL       # this server's address, e.g. https://gink-server.onrender.com
        sync: false
      - key: GINK_SECRET_KEY       # signs sign-in sessions; Render makes a random one
        generateValue: true
      - key: GINK_ADMIN_KEY        # owner tools (tools/grant_pro.py); Render makes a random one
        generateValue: true
      - key: GINK_ALERT_EMAIL      # your email: alerts when something breaks (needs email set up; at most 1 per 15 min)
        sync: false
      # --- the database lives on the disk above (must be inside /var/data) ---
      - key: GINK_DB_PATH
        value: /var/data/gink.db
      # --- plain settings ---
      - key: GINK_FREE_DAILY
        value: "30"
      - key: GINK_PRO_DAILY
        value: "500"
      - key: GINK_PRO_CLAUDE_DAILY  # Claude messages per Pro user per day (Claude costs more than Groq)
        value: "50"
      - key: GINK_SUPPORT_EMAIL     # shown in Settings -> Help
        value: gink@ginkaisupport.com
      - key: GINK_PRIVACY_URL       # Settings -> Privacy (required by app stores)
        value: https://amgib00.github.io/GinkAssistant/privacy.html
      - key: GINK_TERMS_URL
        value: https://amgib00.github.io/GinkAssistant/terms.html
