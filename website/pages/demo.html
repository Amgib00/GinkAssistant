<!--
title: Try the demo
description: Try Gink in your browser: real maths, time and date, and the answers Gink gives to alarms, files, images and Hey Gink.
scripts: demo.js
-->
<div class="glow-edge" aria-hidden="true"></div>
<section class="page-head">
  <div class="wrap">
    <h1>Try Gink</h1>
    <p>This demo runs in your browser. Maths, time and date are real; other requests show how Gink answers in the app.</p>
  </div>
</section>

<section style="padding-top:8px">
  <div class="wrap">
    <div class="demo">
      <div id="demo-log" class="demo-log" aria-live="polite"></div>
      <form id="demo-form" class="demo-form" autocomplete="off">
        <label class="sr" for="demo-input">Message Gink</label>
        <input id="demo-input" placeholder="Ask Gink anything" maxlength="300">
        <button id="demo-mic" class="button button-quiet mic" type="button" aria-label="Speak to Gink">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="button" type="submit">Send</button>
      </form>
    </div>
    <div class="suggestions" aria-label="Try these">
      <button type="button" data-try="Hey Gink">Hey Gink</button>
      <button type="button" data-try="Wake me up at 6:30">Wake me up at 6:30</button>
      <button type="button" data-try="What's 15% of 80000?">What's 15% of 80000?</button>
      <button type="button" data-try="Make my study plan a PDF">Make my study plan a PDF</button>
      <button type="button" data-try="Brief me">Brief me</button>
      <button type="button" data-try="What time is it?">What time is it?</button>
    </div>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <h2>The real Gink does much more</h2>
    <p class="muted">Answers anything, talks back in a natural voice, makes files and images, and works with your computer.</p>
    <div class="actions"><a class="button" href="download.html">Download Gink</a></div>
  </div>
</section>
